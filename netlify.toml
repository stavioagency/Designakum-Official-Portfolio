# Netlify build configuration.
#
# The Next.js runtime plugin is what turns server components, server actions and
# the middleware into Netlify Functions — without it this deploys as a static
# site and every dynamic page 404s.

[build]
  # NOT `npm run build`: that script sets NEXT_DIST_DIR=.next-build so a local
  # build and `next dev` can run at the same time without corrupting each
  # other's chunks. The Netlify plugin looks in the default `.next`, so CI
  # builds plainly.
  command = "npx next build"
  publish = ".next"

[build.environment]
  # Node 22 — `node --test` type stripping and the Postgres driver both want a
  # current runtime, and this matches what the app is developed against.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The image asset route signs short-lived storage URLs per request, so it must
# never be cached at the edge.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
