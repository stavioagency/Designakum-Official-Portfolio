# A copy of the database that Supabase does not hold.
#
# The free plan takes no backups at all, so without this the only copy of every
# customer, portfolio and subscription is the live database. This is not a
# nicety on that plan, it is the difference between a bad morning and the end of
# the platform.
#
# It runs here rather than on the app because a backup that lives in the same
# account as the thing it is backing up is not really a backup. GitHub keeps the
# artefact for 90 days.
#
# Two secrets are needed, both set in Settings, Secrets and variables, Actions:
#   DATABASE_URL       Supabase, Connect, "Session pooler" (port 5432). Not the
#                      direct host, which resolves to IPv6 only and cannot be
#                      reached from a GitHub runner, and not the transaction
#                      pooler on 6543, which pg_dump cannot use.
#   BACKUP_PASSPHRASE  a long random passphrase, kept somewhere other than GitHub
#
# To restore: download the artefact, then
#   gpg --decrypt designakum.sql.gpg > designakum.sql
#   psql "$DATABASE_URL" < designakum.sql
name: Database backup

on:
  schedule:
    # 01:00 UTC, which is a quiet hour in the Gulf.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        id: config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::DATABASE_URL or BACKUP_PASSPHRASE is not set, so no backup was taken."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # Ubuntu ships an older client, and pg_dump refuses a server newer than
      # itself. The database is PostgreSQL 17.
      - name: Install the PostgreSQL 17 client
        if: steps.config.outputs.ready == 'yes'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump
        if: steps.config.outputs.ready == 'yes'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump --no-owner --no-privileges --clean --if-exists "$DATABASE_URL" > designakum.sql
          # A dump that is suspiciously small means the connection succeeded and
          # the data did not come with it. Better to fail than to file it.
          bytes=$(wc -c < designakum.sql)
          echo "Dump is $bytes bytes."
          if [ "$bytes" -lt 10000 ]; then
            echo "::error::The dump is only $bytes bytes, which is too small to be the database."
            exit 1
          fi

      # The dump holds every customer email and password hash. It does not leave
      # this runner unencrypted.
      - name: Encrypt
        if: steps.config.outputs.ready == 'yes'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output designakum.sql.gpg designakum.sql
          rm -f designakum.sql

      - name: Keep it
        if: steps.config.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: designakum-${{ github.run_id }}
          path: designakum.sql.gpg
          retention-days: 90
          if-no-files-found: error
